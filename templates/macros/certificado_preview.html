{% macro certificado_preview_modal(title='Vista previa: Certificado') %}
<div id="certPreviewModal" class="fixed inset-0 z-[100] hidden" aria-hidden="true">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" data-close="1"></div>
    <div class="absolute inset-0 p-4 flex items-center justify-center">
        <div class="w-full max-w-5xl bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-xl shadow-2xl overflow-hidden">
            <div class="px-4 py-3 flex items-center justify-between border-b border-gray-200 dark:border-slate-800 bg-gray-50/80 dark:bg-slate-950/80">
                <div class="text-sm font-semibold text-gray-900 dark:text-slate-100">{{ title }}</div>
                <div class="flex items-center gap-2">
                    <button type="button" id="certPreviewPrint"
                            class="text-sm bg-primary hover:bg-emerald-700 text-white px-3 py-2 rounded-md font-semibold transition-colors">
                        Imprimir / PDF
                    </button>
                    <button type="button" id="certPreviewClose"
                            class="text-sm bg-gray-200 hover:bg-gray-300 dark:bg-slate-800 dark:hover:bg-slate-700 text-gray-900 dark:text-slate-100 px-3 py-2 rounded-md transition-colors">
                        Cerrar
                    </button>
                </div>
            </div>
            <div class="bg-slate-100 dark:bg-slate-950">
                <iframe id="certPreviewFrame" src="about:blank" class="w-full" style="height: min(78vh, 900px); border: 0;" title="Vista previa del certificado"></iframe>
            </div>
        </div>
    </div>
</div>
{% endmacro %}

{% macro certificado_preview_script() %}
<script>
(function() {
    const modal = document.getElementById('certPreviewModal');
    const frame = document.getElementById('certPreviewFrame');
    const closeBtn = document.getElementById('certPreviewClose');
    const printBtn = document.getElementById('certPreviewPrint');
    if (!modal || !frame || !closeBtn || !printBtn) return;

    function open(url) {
        frame.src = url;
        modal.classList.remove('hidden');
        modal.setAttribute('aria-hidden', 'false');
        document.addEventListener('keydown', onKeyDown);
    }
    function close() {
        modal.classList.add('hidden');
        modal.setAttribute('aria-hidden', 'true');
        frame.src = 'about:blank';
        document.removeEventListener('keydown', onKeyDown);
    }
    function onKeyDown(e) {
        if (e.key === 'Escape') close();
    }

    function handlePreviewClick(e) {
        const btn = e.target.closest('.btn-preview[data-preview-url]');
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        open(btn.getAttribute('data-preview-url'));
    }

    // Fase capture: el panel del vecino usa stopPropagation y bloqueaba el listener en bubble.
    document.addEventListener('click', handlePreviewClick, true);

    closeBtn.addEventListener('click', close);
    modal.addEventListener('click', function(e) {
        if (e.target && e.target.getAttribute && e.target.getAttribute('data-close') === '1') close();
    });
    printBtn.addEventListener('click', function() {
        try {
            frame.contentWindow.focus();
            frame.contentWindow.print();
        } catch (e) {
            const src = frame.src || '';
            if (src && src !== 'about:blank') {
                window.open(src, '_blank');
            }
        }
    });
})();
</script>
{% endmacro %}
